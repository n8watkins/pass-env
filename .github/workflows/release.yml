name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
# Release artifacts are built only here, from a tag on main, and get SHA-256
# sums and Sigstore build provenance. See docs/windows-hello.md.
jobs:
  verify:
    # Only the upstream repo publishes: a fork that pushes a tag releases nothing.
    # Every other job needs this one, so they are skipped too.
    if: github.repository == 'n8watkins/pass-env'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches every version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          grep -qx "const VERSION = \"$version\";" pass-env.ts || { echo "::error::pass-env.ts VERSION is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" package.json || { echo "::error::package.json is not $version"; exit 1; }
          grep -qx "version = \"$version\"" hello/Cargo.toml || { echo "::error::hello/Cargo.toml is not $version"; exit 1; }
      - run: cd hello && rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cd hello && cargo deny check && cargo audit

  helper:
    needs: verify
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh
        working-directory: hello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --locked
      - name: Build twice in two folders; the hashes must match
        id: build
        run: |
          $hashes = foreach ($name in "a", "b") {
            $dir = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Path $dir | Out-Null
            Get-ChildItem -Force -Exclude target | Copy-Item -Recurse -Destination $dir
            & (Join-Path $dir "build-release.ps1") | Select-Object -Last 1
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if ($hashes[0] -ne $hashes[1]) { Write-Error "builds differ: $hashes"; exit 1 }
          $sha = ($hashes[0] -split " ")[0]
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "a\target\release\pass-env-hello.exe") out/
          ./out/pass-env-hello.exe version
          "sha256=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pass-env-hello-exe
          path: hello/out/pass-env-hello.exe
          retention-days: 7

  build:
    needs: helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.18
      - run: sudo apt-get update && sudo apt-get install -y pass
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pass-env-hello-exe
          path: dist
      - name: Check the helper and pin its hash into pass-env
        env:
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad helper hash"; exit 1; }
          echo "$HELPER_SHA256  dist/pass-env-hello.exe" | sha256sum --check
          sed -i "s|^const PINNED_HELPER_SHA256 = \"\";\$|const PINNED_HELPER_SHA256 = \"$HELPER_SHA256\";|; s|^const RELEASE_REPO = \"n8watkins/pass-env\";\$|const RELEASE_REPO = \"$REPO\";|" pass-env.ts
          [ "$(grep -cx "const PINNED_HELPER_SHA256 = \"$HELPER_SHA256\";" pass-env.ts)" = 1 ] || { echo "::error::pin not applied"; exit 1; }
          [ "$(grep -cx "const RELEASE_REPO = \"$REPO\";" pass-env.ts)" = 1 ] || { echo "::error::repo not applied"; exit 1; }
          git diff --stat
      - run: bun test
      - run: ./demo/e2e.sh
      - name: Build standalone binaries from the pinned script
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target="bun-$target" pass-env.ts --outfile "dist/pass-env-$target"
          done
          cp pass-env.ts dist/pass-env.ts
      - name: Test the linux-x64 binary like the script
        env:
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          PASS_ENV_BIN=dist/pass-env-linux-x64 bun test
          PASS_ENV_BIN=dist/pass-env-linux-x64 ./demo/e2e.sh
          dist/pass-env-linux-x64 version | grep -q "pins pass-env-hello.exe SHA-256 $HELPER_SHA256"
      - run: cd dist && sha256sum pass-env-* pass-env.ts > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  # Only this small job can write releases and sign provenance, and it runs
  # nothing but first-party actions and gh.
  publish:
    needs: [helper, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Check the helper against the hash the Windows job recorded
        env:
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          echo "$HELPER_SHA256  dist/pass-env-hello.exe" | sha256sum --check
          cd dist && sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pass-env-*
            dist/pass-env.ts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  # npm: the same attested binaries, as pass-env (a small launcher) plus one
  # pass-env-<os>-<arch> package each. Off until the maintainer sets the
  # repository variable NPM_PUBLISH to true; see docs/publishing.md.
  npm:
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1 # trusted publishing needs npm 11.5.1 or newer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - run: cd dist && sha256sum --check SHA256SUMS
      - run: node packaging/npm.mjs dist npm-out
      - name: Publish, platform packages first (a rerun skips versions already on npm)
        env:
          # Empty when trusted publishing is set up; only the first publish needs a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in npm-out/pass-env-* npm-out/pass-env; do
            spec="$(node -p "const p = require('./$package/package.json'); p.name + '@' + p.version")"
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; continue; fi
            npm publish "./$package" --provenance --access public
          done

  # Homebrew: writes Formula/pass-env.rb in n8watkins/homebrew-tap, pushing with
  # a deploy key that can write to that one repository (the HOMEBREW_TAP_DEPLOY_KEY
  # secret). On while the repository variable HOMEBREW_TAP is true.
  homebrew:
    needs: publish
    if: vars.HOMEBREW_TAP == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - run: cd dist && sha256sum --check SHA256SUMS
      - name: Update the formula in the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$TAP_KEY" ] || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/tap-key"
          (umask 077 && printf '%s\n' "$TAP_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          # GitHub's SSH host keys from its API, so the clone never trusts an unknown host.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 git@github.com:n8watkins/homebrew-tap.git tap
          mkdir -p tap/Formula
          node packaging/homebrew.mjs "$version" dist/SHA256SUMS > tap/Formula/pass-env.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pass-env.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "pass-env $version"
          git push
