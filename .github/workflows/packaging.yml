name: Packaging
# Checks the installer, the npm packages and the Homebrew formula the way users
# get them, built from the latest release's files. Runs when packaging changes.
on:
  pull_request:
    paths: ["install.sh", "packaging/**", ".github/workflows/packaging.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'pass-env-*' --pattern SHA256SUMS --dir dist
      # The release's own version, so the packages match its binaries.
      - run: tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" && npm pkg set version="${tag#v}"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: packaging/smoke-npm.sh dist

  installer:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh install.sh --dir "$RUNNER_TEMP/bin"
      - run: '"$RUNNER_TEMP/bin/pass-env" version'

  homebrew:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, test and audit the formula from a local tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          brew tap-new --no-git local/check
          node packaging/homebrew.mjs "${tag#v}" SHA256SUMS > "$(brew --repository local/check)/Formula/pass-env.rb"
          brew install local/check/pass-env
          brew test local/check/pass-env
          brew audit --strict local/check/pass-env
